<svg xmlns="http://www.w3.org/2000/svg" viewBox="160 190 680 640" width="680" height="640" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
  <linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="240" x2="0" y2="760">
    <stop offset="0" stop-color="#A580F8"/><stop offset="1" stop-color="#4B2FC7"/>
  </linearGradient>
  <style>
    .fx{transform-box:fill-box;transform-origin:center}
    .draw{stroke-dasharray:1 1;stroke-dashoffset:1;opacity:0;animation:draw var(--d) cubic-bezier(.65,0,.35,1) var(--t) forwards}
    @keyframes draw{0%{stroke-dashoffset:1;opacity:0}2%{opacity:1}100%{stroke-dashoffset:0;opacity:1}}
    .pop{opacity:0;transform:scale(0);animation:pop .7s cubic-bezier(.34,1.56,.64,1) var(--t) forwards}
    @keyframes pop{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:scale(1)}}
    .beat{animation:beat 3s ease-in-out 2.6s infinite}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    .float{animation:float 4s ease-in-out 2.6s infinite}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
    .shine{stroke-dasharray:.06 .94;opacity:0;animation:shineA 3s linear 2.4s infinite}
    .shineB{stroke-dasharray:.1 .9;opacity:0;animation:shineB 3s linear 2.4s infinite}
    @keyframes shineA{0%{stroke-dashoffset:.06;opacity:0}2%{opacity:.9}66%{opacity:.9}70%,100%{stroke-dashoffset:-.94;opacity:0}}
    @keyframes shineB{0%,7%{stroke-dashoffset:.1;opacity:0}8%{stroke-dashoffset:.1;opacity:.9}28%{opacity:.9}30%,100%{stroke-dashoffset:-.9;opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
  </style>
  </defs>
  <g class="float">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path class="draw" pathLength="1" style="--t:1s;--d:.8s" d="M505 610 C470 530 400 500 312 500" stroke="url(#g)" stroke-width="34"/>
    <path class="draw" pathLength="1" style="--t:1s;--d:.8s" d="M525 610 C565 530 630 502 712 500" stroke="url(#g)" stroke-width="34"/>
    <path class="draw" pathLength="1" style="--t:.3s;--d:1.2s" d="M515 700 L515 640 C515 580 525 545 560 510 C600 470 650 430 650 365 C650 300 600 250 520 250 C450 250 395 285 388 350" stroke="url(#g)" stroke-width="40"/>
    <path class="shineB" pathLength="1" d="M505 610 C470 530 400 500 312 500" stroke="#fff" stroke-width="12" stroke-opacity=".7"/>
    <path class="shineB" pathLength="1" d="M525 610 C565 530 630 502 712 500" stroke="#fff" stroke-width="12" stroke-opacity=".7"/>
    <path class="shine" pathLength="1" d="M515 700 L515 640 C515 580 525 545 560 510 C600 470 650 430 650 365 C650 300 600 250 520 250 C450 250 395 285 388 350" stroke="#fff" stroke-width="14" stroke-opacity=".7"/>
    <g class="fx pop" style="--t:1.5s"><circle cx="378" cy="385" r="31" stroke="#8B63EE" stroke-width="22"/></g>
    <g class="fx pop" style="--t:1.8s"><circle cx="272" cy="512" r="31" stroke="#6644D6" stroke-width="22"/></g>
    <g class="fx pop" style="--t:1.9s"><circle cx="752" cy="512" r="31" stroke="#6644D6" stroke-width="22"/></g>
  </g>
  <g transform="translate(510 722)"><g class="fx pop" style="--t:0s"><g class="fx beat">
    <rect x="-34" y="-34" width="68" height="68" rx="20" fill="#FFFFFF" stroke="#4B2FC7" stroke-width="16" transform="rotate(45)"/>
  </g></g></g>
</g>
</svg>
